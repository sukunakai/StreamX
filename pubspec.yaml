name: streamx
description: "A hyper-premium video streaming platform built for high refresh rates and cinema-grade playback."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  provider: ^6.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  video_player: ^2.9.2
  chewie: ^1.8.5
  flutter_downloader: ^1.11.8
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_displaymode: ^0.6.0
  shared_preferences: ^2.3.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
